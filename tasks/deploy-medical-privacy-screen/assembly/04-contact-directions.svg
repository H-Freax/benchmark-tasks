<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940"><ns0:defs><ns0:marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><ns0:path d="M0,0 L8,4 L0,8" fill="none" stroke="#245f9b" /></ns0:marker></ns0:defs><ns0:style>text{font-family:DejaVu Sans,sans-serif;font-size:15px;fill:#172635}.t{font-size:24px;font-weight:bold}.s{font-size:13px}.n{fill:#a32626}.dim{stroke:#245f9b;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}.axis{stroke:#9157b2;stroke-dasharray:7 4;stroke-width:1.4}.src{fill:#d9e4ec;stroke:#243645;stroke-width:1.4}.new{fill:#f1c894;stroke:#8c4a0c;stroke-width:1.4}.thin{fill:none;stroke:#243645;stroke-width:1.2}</ns0:style><ns0:rect width="1200" height="940" fill="white" /><ns0:text x="38" y="40" class="t">04  Contact limits: do not force the panels through each other</ns0:text><ns0:text x="38" y="68" class="s">Illustrations hold centre yaw at0. q is native joint rotation from the authored U state. Geometry contact decides travel.</ns0:text><ns0:text x="280" y="140" class="t">Reference direction: q=+45deg</ns0:text><ns0:polygon points="300.0,366.3 652.8,366.3 652.8,353.7 300.0,353.7" class="src" opacity=".65" /><ns0:polygon points="297.7726136392624,371.6773863607376 48.305341236648445,122.21011395812363 39.39579579369797,131.11965940107413 288.8630681963119,380.5869318036881" class="new" opacity=".65" /><ns0:circle cx="300.0" cy="369.45" r="5" class="new" /><ns0:text x="45" y="420" class="s">Left relative yaw135deg: source frames/feet clear at nominal goal.</ns0:text><ns0:text x="620" y="510" class="t" style="font-size:19px;font-weight:bold" textLength="540" lengthAdjust="spacingAndGlyphs">Blocked physical direction: q=-90deg</ns0:text><ns0:polygon points="700.0,736.3 1052.8,736.3 1052.8,723.7 700.0,723.7" class="src" opacity=".65" /><ns0:polygon points="700.0,736.3 1052.8,736.3 1052.8,723.7 700.0,723.7" class="new" opacity=".65" /><ns0:circle cx="700.0" cy="739.45" r="5" class="new" /><ns0:text x="620" y="790" class="s">Relative yaw0deg: all19solids coincide if contacts are disabled.</ns0:text><ns0:text x="38" y="835" class="s">Adjacent panels collide; a blocked direction must stop on native contact, without passing through.</ns0:text><ns0:text x="38" y="854" class="s">A mathematical joint limit alone does not prove finite frames, feet or proposed hardware can pass.</ns0:text><ns0:text x="38" y="873" class="s">Check native finite-solid contact and the added physical hardware sweep; do not force intersecting solids.</ns0:text><ns0:text x="38" y="892" class="s">The two hinge heights do not grant clearance. Hardware sweep, grip clearance and real strength still require checks.</ns0:text><ns0:text x="38" y="911" class="s">Angles on this sheet are examples/reference choices, not extra task scoring requirements or an OEM folding claim.</ns0:text></ns0:svg>