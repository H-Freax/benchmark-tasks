<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940"><ns0:defs><ns0:marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><ns0:path d="M0,0 L8,4 L0,8" fill="none" stroke="#245f9b" /></ns0:marker></ns0:defs><ns0:style>text{font-family:DejaVu Sans,sans-serif;font-size:15px;fill:#172635}.t{font-size:24px;font-weight:bold}.s{font-size:13px}.n{fill:#a32626}.dim{stroke:#245f9b;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}.axis{stroke:#9157b2;stroke-dasharray:7 4;stroke-width:1.4}.src{fill:#d9e4ec;stroke:#243645;stroke-width:1.4}.new{fill:#f1c894;stroke:#8c4a0c;stroke-width:1.4}.thin{fill:none;stroke:#243645;stroke-width:1.2}</ns0:style><ns0:rect width="1200" height="940" fill="white" /><ns0:text x="38" y="40" class="t">01  Panel geometry and proposed mounting elevations</ns0:text><ns0:text x="38" y="68" class="s">All dimensions mm. Blue = exact native envelope. Orange = unbuilt original hardware proposal.</ns0:text><ns0:rect x="120.0" y="124.63999999999999" width="12.9" height="697.46" class="src" /><ns0:rect x="119.57" y="822.1" width="13.76" height="12.9" class="src" /><ns0:rect x="347.9" y="124.63999999999999" width="12.9" height="697.46" class="src" /><ns0:rect x="347.47" y="822.1" width="13.76" height="12.9" class="src" /><ns0:rect x="132.9" y="800.6" width="215.0" height="12.9" class="src" /><ns0:rect x="132.9" y="124.63999999999999" width="215.0" height="12.9" class="src" /><ns0:rect x="132.9" y="137.53999999999996" width="215.0" height="663.06" class="src" /><ns0:text x="195" y="430" class="s">Opaque PVC foam</ns0:text><ns0:text x="195" y="453" class="s">500 x 3 x 1542</ns0:text><ns0:rect x="116.0" y="693.1" width="16" height="25.8" class="new" /><ns0:rect x="344.76" y="693.1" width="16" height="25.8" class="new" /><ns0:line x1="110" y1="706.0" x2="370.79999999999995" y2="706.0" class="axis" /><ns0:text x="125" y="689.0" class="s">Hinge centre z=300 (proposed)</ns0:text><ns0:rect x="116.0" y="263.1" width="16" height="25.8" class="new" /><ns0:rect x="344.76" y="263.1" width="16" height="25.8" class="new" /><ns0:line x1="110" y1="276.0" x2="370.79999999999995" y2="276.0" class="axis" /><ns0:text x="125" y="259.0" class="s">Hinge centre z=1300 (proposed)</ns0:text><ns0:line x1="75" y1="835.0" x2="75" y2="124.63999999999999" class="dim" /><ns0:text x="38" y="495" class="">1652</ns0:text><ns0:line x1="120" y1="865" x2="360.79999999999995" y2="865" class="dim" /><ns0:text x="210" y="890" class="">560 nominal</ns0:text><ns0:text x="450" y="130" class="t">Exact current panel-local coordinates</ns0:text><ns0:text x="450" y="175" class="s">Vertical rails: x=0..30 and530..560; y=-10..+10; z=30..1652.</ns0:text><ns0:text x="450" y="209" class="s">Horizontal rails: x=30..530; z=50..80 and1622..1652.</ns0:text><ns0:text x="450" y="243" class="s">PVC inlay: x=30..530; y=-1.5..+1.5; z=80..1622.</ns0:text><ns0:text x="450" y="277" class="s">Foot blocks: x=-1..31 and529..561; y=-12..+12; z=0..30.</ns0:text><ns0:text x="450" y="311" class="s">Native panel mass3.3156072kg; total3panels9.9468216kg.</ns0:text><ns0:text x="450" y="345" class="s">No hinge pin, leaf, bolt, weld, adhesive or foot insert mass included.</ns0:text><ns0:text x="450" y="379" class="s">Left joint axis: centre and wing(x0,y-15).</ns0:text><ns0:text x="450" y="413" class="s">Right joint: centre(x560,y+15), wing(x0,y+15).</ns0:text><ns0:text x="450" y="447" class="s">Each axis has two proposed short hinges atz300 and1300.</ns0:text><ns0:text x="450" y="481" class="s">The abstract native anchorz0 identifies the axis; no floor-level pin.</ns0:text><ns0:text x="450" y="565" class="t">Original fabrication sequence</ns0:text><ns0:text x="450" y="605" class="s">1. Cut and square six vertical and six horizontal30x20x2 tubes.</ns0:text><ns0:text x="450" y="636" class="s">2. Fixture the frame to560x1652; butt-weld rails without twist.</ns0:text><ns0:text x="450" y="667" class="s">3. Retain rigidPVC using compatible0.5mm-radius adhesive fillets.</ns0:text><ns0:text x="450" y="698" class="s">   Adhesive product/strength/preparation and weld details remainTBD.</ns0:text><ns0:text x="450" y="729" class="s">4. Fit bolted rubber foot blocks; check recessed heads clear the floor.</ns0:text><ns0:text x="450" y="760" class="s">5. Drill hinge holes from one coaxial jig; fit both elevated bearings.</ns0:text><ns0:text x="450" y="791" class="s">6. Weigh and inspect real assembly before claiming source equivalence.</ns0:text><ns0:text x="38" y="925" class="n">UNBUILT PROPOSAL: not OEM CAD, not measured, no certified load or full folding envelope.</ns0:text></ns0:svg>