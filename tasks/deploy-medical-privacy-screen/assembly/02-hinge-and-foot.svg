<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940"><ns0:defs><ns0:marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><ns0:path d="M0,0 L8,4 L0,8" fill="none" stroke="#245f9b" /></ns0:marker></ns0:defs><ns0:style>text{font-family:DejaVu Sans,sans-serif;font-size:15px;fill:#172635}.t{font-size:24px;font-weight:bold}.s{font-size:13px}.n{fill:#a32626}.dim{stroke:#245f9b;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}.axis{stroke:#9157b2;stroke-dasharray:7 4;stroke-width:1.4}.src{fill:#d9e4ec;stroke:#243645;stroke-width:1.4}.new{fill:#f1c894;stroke:#8c4a0c;stroke-width:1.4}.thin{fill:none;stroke:#243645;stroke-width:1.2}</ns0:style><ns0:rect width="1200" height="940" fill="white" /><ns0:text x="38" y="40" class="t">02  Coaxial short hinge and foot attachment details</ns0:text><ns0:text x="38" y="68" class="s">Original manufacturing proposal; all dimensions mm; fits, weld strength and complete sweep remain unverified.</ns0:text><ns0:text x="40" y="105" class="t" style="font-size:18px;font-weight:bold">A. Top section at hinge / negative-y face</ns0:text><ns0:rect x="125" y="190" width="240" height="160" class="src" /><ns0:rect x="125" y="350" width="224" height="8" class="new" /><ns0:rect x="125" y="358" width="224" height="12.0" class="new" /><ns0:circle cx="125" cy="390" r="32" class="new" /><ns0:circle cx="125" cy="390" r="16.8" class="thin" /><ns0:circle cx="125" cy="390" r="16" class="thin" /><ns0:line x1="69" y1="390" x2="405" y2="390" class="axis" /><ns0:line x1="125" y1="454" x2="125" y2="150" class="axis" /><ns0:line x1="61" y1="390" x2="61" y2="350" class="dim" /><ns0:text x="46" y="366" class="">5 axis offset</ns0:text><ns0:text x="130" y="440" class="s">Rail facey=-10; spacer-10..-11; leaf-11..-12.5.</ns0:text><ns0:text x="130" y="465" class="s">KnuckleOD8/ID4.2; smooth pinD4. Positive-y face mirrored.</ns0:text><ns0:text x="590" y="105" class="t" style="font-size:18px;font-weight:bold">B. Leaf / knuckle elevation</ns0:text><ns0:rect x="650" y="180" width="112" height="240" class="new" /><ns0:circle cx="714" cy="228" r="9.0" class="thin" /><ns0:circle cx="714" cy="372" r="9.0" class="thin" /><ns0:rect x="634" y="180" width="32" height="46.4" class="new" /><ns0:rect x="634" y="228.4" width="32" height="46.4" class="src" /><ns0:rect x="634" y="276.8" width="32" height="46.4" class="new" /><ns0:rect x="634" y="325.2" width="32" height="46.4" class="src" /><ns0:rect x="634" y="373.6" width="32" height="46.4" class="new" /><ns0:line x1="650" y1="165" x2="650" y2="435" class="axis" /><ns0:line x1="790" y1="180" x2="790" y2="420" class="dim" /><ns0:text x="801" y="305" class="">60</ns0:text><ns0:line x1="650" y1="445" x2="762" y2="445" class="dim" /><ns0:text x="686" y="470" class="">28</ns0:text><ns0:text x="805" y="165" class="s" textLength="350" lengthAdjust="spacingAndGlyphs">2xD4.5 holes: x16; zcentre-18 and+18.</ns0:text><ns0:text x="805" y="199" class="s" textLength="350" lengthAdjust="spacingAndGlyphs">5knuckles:11.6each,4gaps0.5; total60.</ns0:text><ns0:text x="805" y="233" class="s" textLength="350" lengthAdjust="spacingAndGlyphs">Owners alternate parent/child/parent/child/parent.</ns0:text><ns0:text x="805" y="267" class="s" textLength="350" lengthAdjust="spacingAndGlyphs">Pin: D4x60 smooth, D7x2 head, M3x5 lower end.</ns0:text><ns0:text x="805" y="301" class="s" textLength="350" lengthAdjust="spacingAndGlyphs">Use M3 retention nut/washer; no axial clamp on rotation.</ns0:text><ns0:text x="805" y="335" class="s" textLength="350" lengthAdjust="spacingAndGlyphs">Leaf/spacer holes: centre±0.2; coaxiality0.2 proposed.</ns0:text><ns0:text x="40" y="540" class="t">C. Foot section (vertical plane through rail centre)</ns0:text><ns0:rect x="105" y="545" width="120" height="200" class="src" /><ns0:rect x="113.8" y="665" width="102.4" height="80" class="new" /><ns0:rect x="101" y="745" width="128" height="120" class="src" /><ns0:rect x="156.0" y="745" width="18.0" height="120" class="new" /><ns0:rect x="149" y="849" width="32" height="16" class="new" /><ns0:line x1="165" y1="849" x2="165" y2="689" class="axis" /><ns0:line x1="75" y1="865" x2="285" y2="865" class="thin" /><ns0:text x="355" y="590" class="s">Native solid rubber outer envelope32x24x30.</ns0:text><ns0:text x="355" y="624" class="s">Proposed end plug25.6x15.6x20, inside tubez30..50.</ns0:text><ns0:text x="355" y="658" class="s">Check actual tube26x16 cavity and corner radii.</ns0:text><ns0:text x="355" y="692" class="s">Tap axialM4 to15deep; M4x40 screw from foot underside.</ns0:text><ns0:text x="355" y="726" class="s">Foot D4.5 bore; D8x4-deep recess; head &gt;=1clear of floor.</ns0:text><ns0:text x="355" y="760" class="s">Two M3 cross retainers at localz40, x8/22 per rail.</ns0:text><ns0:text x="355" y="794" class="s">Real bores, plugs and screws change mass/inertia.</ns0:text><ns0:text x="355" y="828" class="s">Native foot is solid; this detail is an explicit approximation.</ns0:text><ns0:text x="38" y="925" class="n">DISCLOSED OMISSIONS: proposed hinge hardware and foot mounting are absent from native mass/contact geometry.</ns0:text></ns0:svg>